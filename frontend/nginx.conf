# Static hosting for the built single-page app.
#
# The interesting part is `location /api/`: the browser calls the API on the same
# origin, so `src/api` can use a relative base path and no CORS is involved in
# production. `api` resolves through Docker's internal DNS to the backend
# service in compose.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable, so let the browser keep them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The HTML shell must not be cached, or clients keep old asset references.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SEO and icon files. They change rarely but must be re-fetchable soon after a
    # correction, so one day is the compromise between freshness and traffic.
    location ~ ^/(robots\.txt|sitemap\.xml|favicon\.svg|og-image\.svg)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Proxy to the API container. Trailing slashes matter: nginx replaces the
    # matched prefix, so `/api/tickets` arrives as `/api/tickets` upstream.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page-app fallback: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip is free CPU for a large JS payload; skip it for already-small files and
    # for images, which are compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

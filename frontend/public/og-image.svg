<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Support Ticket Tracker">
  <!--
    1200x630 is the Open Graph / Twitter `summary_large_image` size.

    SVG works for the major crawlers, but some older ones (and some Slack
    unfurlers) only render raster. If that matters for a given deployment,
    rasterise this to og-image.png with any converter and point the two
    `og:image` tags in index.html at it instead.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#174ea6" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ticket cards, echoing the UI's row layout. -->
  <g transform="translate(120 170)">
    <rect width="960" height="96" rx="16" fill="#ffffff" fill-opacity="0.14" />
    <rect x="28" y="26" width="330" height="18" rx="9" fill="#ffffff" fill-opacity="0.9" />
    <rect x="28" y="58" width="200" height="14" rx="7" fill="#ffffff" fill-opacity="0.55" />
    <rect x="700" y="32" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.85" />
    <rect x="828" y="32" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.45" />
  </g>
  <g transform="translate(120 290)">
    <rect width="960" height="96" rx="16" fill="#ffffff" fill-opacity="0.10" />
    <rect x="28" y="26" width="270" height="18" rx="9" fill="#ffffff" fill-opacity="0.8" />
    <rect x="28" y="58" width="240" height="14" rx="7" fill="#ffffff" fill-opacity="0.45" />
    <rect x="700" y="32" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.7" />
    <rect x="828" y="32" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.35" />
  </g>

  <text x="120" y="120" fill="#ffffff" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="700">
    Support Ticket Tracker
  </text>
  <text x="120" y="500" fill="#ffffff" fill-opacity="0.85" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="32">
    Create · Prioritise · Filter by status · Resolve
  </text>
</svg>

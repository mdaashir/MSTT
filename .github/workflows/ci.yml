name: CI

# Runs on every push to main and every pull request targeting it. Both packages
# are checked in parallel, so a backend failure never hides a frontend one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run on the same ref is wasted work: cancel it rather than pay for
# two builds that disagree about the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # better-sqlite3 is a native module that ships binding.gyp without an
      # install script, so npm runs `node-gyp rebuild` during `npm ci`. That
      # needs a C/C++ toolchain and Python; without it the install fails. The
      # Dockerfile does the same thing in its build stage.
      - name: Install native build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 make g++

      - name: Install dependencies
        # --include=dev is deliberate: TypeScript, ESLint and Vitest are dev
        # dependencies, and some environments default to omitting them.
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
